name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build GitHub Pages product
        run: npm run build:pages

      - name: Verify GitHub Pages artifact
        run: npm run test:pages-artifact

      - name: Block exposed credentials in GitHub Pages artifact
        run: npm run security:pages

      - name: Build public static compatibility mode
        run: npm run build:public-mirror

      - name: Smoke-test public mirror through HTTP
        run: npm run test:public-mirror

      - name: Block exposed credentials in source and build output
        run: npm run security:secrets

      - name: Block exposed credentials in public mirror
        run: npm run security:mirror
