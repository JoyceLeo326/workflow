name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Vercel static product
        run: npm run build:vercel-static

      - name: Verify Vercel static artifact
        run: npm run test:vercel-artifact

      - name: Block exposed credentials in Vercel static artifact
        run: npm run security:vercel-static

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify Vercel root desktop and 320px journeys
        run: npm run test:e2e:vercel-static

      - name: Build GitHub Pages product
        run: npm run build:pages

      - name: Verify GitHub Pages artifact
        run: npm run test:pages-artifact

      - name: Block exposed credentials in GitHub Pages artifact
        run: npm run security:pages

      - name: Verify Pages desktop and 320px journeys
        run: npm run test:e2e:pages

      - name: Build public static compatibility mode
        run: npm run build:public-mirror

      - name: Smoke-test public mirror through HTTP
        run: npm run test:public-mirror

      - name: Block exposed credentials in source and build output
        run: npm run security:secrets

      - name: Block exposed credentials in public mirror
        run: npm run security:mirror
