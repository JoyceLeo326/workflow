name: Deploy GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vercel-compatible static product
        run: npm run build:vercel-static

      - name: Verify Vercel-compatible static artifact
        run: npm run test:vercel-artifact

      - name: Scan Vercel-compatible static artifact for credentials
        run: npm run security:vercel-static

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify root desktop and 320px complete journeys
        run: npm run test:e2e:vercel-static

      - name: Build complete static product
        run: npm run build:pages

      - name: Verify static product artifact
        run: npm run test:pages-artifact

      - name: Scan static artifact for credentials
        run: npm run security:pages

      - name: Verify desktop and 320px complete journeys
        run: npm run test:e2e:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
